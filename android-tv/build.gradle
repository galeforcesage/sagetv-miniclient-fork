apply plugin: 'com.android.application'
//apply plugin: 'com.google.gms.google-services' // Google services Gradle plugin

// Apply the Crashlytics Gradle plugin
//apply plugin: 'com.google.firebase.crashlytics'

def computeVersionCode()
{
    return appVersionCode
}

def safeGitShortSha()
{
    try {
        def p = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootDir)
        p.waitFor()
        if (p.exitValue() == 0) {
            def sha = p.in.text.trim()
            if (sha != null && !sha.isEmpty()) return sha
        }
    } catch (Throwable ignored) {}
    return "nogit"
}

def buildStampUtc()
{
    return new Date().format("yyyyMMdd.HHmm", TimeZone.getTimeZone("UTC"))
}

def computeVersionName()
{
    return "${appVersionName}"
}

Properties signingProps = new Properties()
def propFile = file("../keystore.properties")

if (propFile.canRead())
{
    signingProps.load(new FileInputStream(propFile))
}
else
{
    System.out.println("Keystore properties file missing. Expceted path:" + propFile.path)
}

android {
    namespace 'sagex.miniclient.android.tv'
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    defaultConfig {

        applicationId "jvl.sage.miniclient.android.tv.debug"
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
        // versionCode API (2 digits), SCREEN (2 digits), VERSION (3 digits)
        versionCode computeVersionCode()
        versionName computeVersionName()
        ndk.abiFilters 'armeabi-v7a','arm64-v8a'
    }

    signingConfigs
    {
        release
        {
            keyAlias = "client"

            if (signingProps!=null && signingProps.containsKey("keyAlias") && signingProps.containsKey("storeFile")
                    && signingProps.containsKey("storePassword") && signingProps.containsKey("keyPassword"))
            {
                keyAlias = signingProps.getProperty("keyAlias")
                storeFile = new File(signingProps.getProperty("storeFile"))
                storePassword = signingProps.getProperty("storePassword")
                keyPassword = signingProps.getProperty("keyPassword")

                System.out.println("signing config setup from properties file")
            }
            else
            {
                try
                {


                    storeFile = file(project.getProperty("keystore"))
                    storePassword = project.getProperty("storePass")
                    keyAlias = project.getProperty("alias")
                    keyPassword = project.getProperty("keyPass")

                    System.out.println("signing config missing or incorrectly configured.  Using command line params")
                }
                catch (Exception ex){}
            }
        }
        debug
        {
            keyAlias = "client"

            if (signingProps!=null && signingProps.containsKey("keyAlias") && signingProps.containsKey("storeFile")
                    && signingProps.containsKey("storePassword") && signingProps.containsKey("keyPassword"))
            {
                keyAlias = signingProps.getProperty("keyAlias")
                storeFile = new File(signingProps.getProperty("storeFile"))
                storePassword = signingProps.getProperty("storePassword")
                keyPassword = signingProps.getProperty("keyPassword")

                System.out.println("signing config setup from properties file")
            }
            else
            {
                try
                {
                    storeFile = file(project.getProperty("keystore"))
                    storePassword = project.getProperty("storePass")
                    keyAlias = project.getProperty("alias")
                    keyPassword = project.getProperty("keyPass")

                    System.out.println("signing config missing or incorrectly configured.  Using command line params")
                }
                catch (Exception ex){}
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }

    buildTypes
    {
        release
        {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug
        {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            debuggable true

            //Identify the application as debug, and allow it to be installed along side production
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-DEBUG"
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }

    // Two product flavors:
    //  * online — base APK with online streaming only (no download/offline code).
    //  * mobile — adds the android-offline module: downloads, offline library,
    //             local playback, sync. Used for phones/tablets/Shield where
    //             users want to keep media for offline viewing.
    flavorDimensions "feature"
    productFlavors {
        online {
            dimension "feature"
            applicationIdSuffix = ".online"
            versionNameSuffix = "-online"
            resValue "string", "flavor_name", "Online"
        }
        mobile {
            dimension "feature"
            applicationIdSuffix = ".mobile"
            versionNameSuffix = "-mobile"
            resValue "string", "flavor_name", "Mobile"
        }
    }

    // Per-variant app label: combine flavor (online / mobile) with build type
    // (release / debug) into an app_name resource alias. The actual label
    // strings live in res/values/strings.xml as app_name_<flavor>_<buildType>.
    //   online + release -> "SageTV Android Client"
    //   online + debug   -> "SageTV Android Client (DEBUG)"
    //   mobile + release -> "SageTV-NG"
    //   mobile + debug   -> "SageTV-NG (DEBUG)"
    applicationVariants.all { variant ->
        def flavor = variant.flavorName
        def buildType = variant.buildType.name
        variant.resValue "string", "app_name", "@string/app_name_${flavor}_${buildType}"
    }
}



dependencies {

    api project(":android-shared")
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "androidx.leanback:leanback:1.0.0"
    api "com.github.bumptech.glide:glide:3.8.0"

    // Offline/download module — only included in the "mobile" flavour APK.
    mobileImplementation project(":android-offline")

    // Import the BoM for the Firebase platform
    //implementation platform('com.google.firebase:firebase-bom:30.0.0')

    // Declare the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    //implementation 'com.google.firebase:firebase-crashlytics'
    //implementation 'com.google.firebase:firebase-analytics'


}

clean {
    delete '../build', 'android-phone-release.apk', 'android-tv-release.apk'
}