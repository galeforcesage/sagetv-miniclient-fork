apply plugin: "java-library"

sourceCompatibility = 17
targetCompatibility = 17
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'


//sourceSets.main.java.srcDirs = [ "src/" ]
//sourceSets.main.resources.srcDirs = [ "resources/" ]
//sourceSets.test.java.srcDirs = ["test/"]

jar {
    archiveBaseName = "sagetv-miniclient-lib"
}

repositories {
    google()
    jcenter()
}

dependencies {

    api 'com.jcraft:jzlib:1.1.3'
    //api "org.slf4j:slf4j-api:1.7.6"
    api group:  'org.slf4j', name: 'slf4j-api', version: '1.7.6'

    api "org.nanohttpd:nanohttpd:2.2.0"

    // circular buffer
    api 'org.ostermiller:utils:1.07.00'

    // org.json is provided by Android at runtime; needed at compile time for NgPlaybackContextParser
    compileOnly 'org.json:json:20240303'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-all:1.10.19'
    testImplementation 'org.json:json:20240303'
    //implementation "com.google.android.exoplayer:exoplayer-core:${exoVersion}"


}
