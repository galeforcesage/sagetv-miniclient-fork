buildscript {
    repositories {
        google()
        //mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        flatDir {
            dirs 'libs'
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath 'com.google.gms:google-services:4.4.1'

        // Add the Crashlytics Gradle plugin
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
    }
}


allprojects {

    version = '1.0'

    ext {

        appVersionCode = 2101649
        appVersionName = "1.15.149"


        gdxVersion = "1.13.1"
        // NOTE: This is for ext we need to build ffmpeg
        exoVersionCustomExt = '2.19.1'
        // NOTE: using regular exoplayer for core stuff (2.19.1 is the
        // last com.google.android.exoplayer2 release; AndroidX Media3
        // is intentionally NOT used per project policy)
        exoVersion = '2.19.1'
        ijkVersionDev = '0.8.8-SNAPSHOT'
        androidBuildToolsVersion = "34.0.0"
        androidMinSdkVersion = 21
        androidCompileSdkVersion = 34
        androidTargetSdkVersion = 34
        // tell every project where to find the local project maven files
        mavenInProject = file('../mavenlocal').absoluteFile.toURI()
        defJavaVesionNum = 17
        defJavaVesionConst = JavaVersion.VERSION_17
    }

    repositories {
        maven { url mavenInProject }
        google()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        flatDir {
            dirs '../libs'
        }
    }

    configurations.configureEach {
        // Keep one Kotlin stdlib line; older jdk7/jdk8 artifacts duplicate classes on AGP 8.
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
        }
    }
}

